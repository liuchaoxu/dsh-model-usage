# dsh-model-usage bundle patch: mounts the package's node half as a host entry.
# The node half hosts the loopback-only /model-usage Web routes that query the
# usage of the model the current conversation runs on (with that provider's own
# credential reference); the browser half (discovered by client-modules from
# this row's dsh.client declaration) renders the 用量 button and panel.
- insert:
    - id: model-usage
      name: 'dsh-model-usage'
